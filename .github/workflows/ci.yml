name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Bound peak compilation/linking memory on hosted runners.
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  # CI does not need debug symbols; omit them to reduce linker memory and disk use.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  rust-check:
    name: Rust Check & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-check-v2-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-check-v2-

      - name: Check formatting
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    needs: rust-check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.14

      - name: Install Python dependencies
        working-directory: python
        run: uv sync

      - name: Use project venv in PATH
        run: echo "${{ github.workspace }}/python/.venv/bin" >> $GITHUB_PATH

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-test-v2-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-v2-

      - name: Compile workspace tests
        working-directory: rust
        run: cargo test --workspace --locked --no-run

      - name: Run workspace tests
        working-directory: rust
        env:
          QUANTCTL_PYTHON: ${{ github.workspace }}/python/.venv/bin/python
        run: cargo test --workspace --locked -- --nocapture

      - name: Report runner resources on failure
        if: failure()
        run: |
          free -h
          df -h
          df -i
          du -sh rust/target ~/.cargo/registry ~/.cargo/git 2>/dev/null || true

  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        working-directory: python
        run: uv sync

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Rust parity verifier
        run: cargo build --manifest-path rust/Cargo.toml --bin quantctl --locked

      - name: Run pytest suite
        working-directory: python
        run: uv run pytest tests -v

  bench-gate:
    name: Benchmark Compilation & Execution Gate
    runs-on: ubuntu-latest
    needs: rust-check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-bench-v2-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-bench-v2-

      - name: Compile benchmarks
        working-directory: rust
        run: cargo bench --no-run

      - name: Run benchmark execution gate
        working-directory: rust
        run: cargo bench --bench feature_benchmarks --bench simulation_benchmarks -- --test

  web-test:
    name: Frontend, Contract and Browser Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-web-cargo-v2-${{ hashFiles('rust/Cargo.lock') }}
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Check generated contract
        working-directory: web
        run: npm run contract:check
      - name: Frontend unit tests and production build
        working-directory: web
        run: |
          npm test
          npm run build
      - name: Build embedded application
        run: cargo build --manifest-path rust/Cargo.toml --bin quantctl --locked
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile browser tests
        working-directory: web
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: web/test-results

  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [rust-check, rust-test, python-test, bench-gate, web-test]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          if [[ "${{ needs.rust-check.result }}" != "success" ]] || \
             [[ "${{ needs.rust-test.result }}" != "success" ]] || \
             [[ "${{ needs.python-test.result }}" != "success" ]] || \
             [[ "${{ needs.bench-gate.result }}" != "success" ]] || \
             [[ "${{ needs.web-test.result }}" != "success" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI checks passed"
