[project]
name = "lstm-quant-ml"
version = "0.1.0"
description = "Machine learning and training subsystem for LSTM quantitative research platform"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "pyyaml>=6.0",
    "scipy>=1.12.0",
    "torch>=2.2.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.17.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
package = false
